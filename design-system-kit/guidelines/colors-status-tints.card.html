<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status tints</title><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--cc-white)}.rw{display:flex;gap:14px;flex-wrap:wrap}.sw{width:110px}.chip{height:62px;border-radius:var(--cc-radius-md)}.nm{font-family:var(--cc-font-subtitle);font-size:12px;font-weight:600;color:var(--cc-ink);margin:8px 0 1px}.hx{font-family:var(--cc-font-mono);font-size:11px;color:var(--cc-text-muted)}.tk{font-family:var(--cc-font-mono);font-size:11px;color:var(--cc-slate-60)}</style></head><body><div class="rw"><div class="sw"><div class="chip" style="background:#e8f3ee;border:1px solid var(--cc-border)"></div><div class="nm">Success tint</div><div class="hx">#e8f3ee</div></div><div class="sw"><div class="chip" style="background:#fdf3e2;border:1px solid var(--cc-border)"></div><div class="nm">Warning tint</div><div class="hx">#fdf3e2</div></div><div class="sw"><div class="chip" style="background:#fbeceb;border:1px solid var(--cc-border)"></div><div class="nm">Danger tint</div><div class="hx">#fbeceb</div></div><div class="sw"><div class="chip" style="background:#eaf4fb;border:1px solid var(--cc-border)"></div><div class="nm">Info tint</div><div class="hx">#eaf4fb</div></div></div></body></html>
