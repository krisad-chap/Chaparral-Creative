<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--cc-white)}.rw{display:flex;gap:14px;flex-wrap:wrap}.sw{width:110px}.chip{height:62px;border-radius:var(--cc-radius-md)}.nm{font-family:var(--cc-font-subtitle);font-size:12px;font-weight:600;color:var(--cc-ink);margin:8px 0 1px}.hx{font-family:var(--cc-font-mono);font-size:11px;color:var(--cc-text-muted)}.tk{font-family:var(--cc-font-mono);font-size:11px;color:var(--cc-slate-60)}</style></head><body><div class="rw"><div class="sw"><div class="chip" style="background:#2d7a59;"></div><div class="nm">Success</div><div class="hx">#2d7a59</div></div><div class="sw"><div class="chip" style="background:#98641a;"></div><div class="nm">Warning</div><div class="hx">#98641a</div></div><div class="sw"><div class="chip" style="background:#c0392b;"></div><div class="nm">Danger</div><div class="hx">#c0392b</div></div><div class="sw"><div class="chip" style="background:#3498db;"></div><div class="nm">Info</div><div class="hx">#3498db</div></div></div></body></html>
